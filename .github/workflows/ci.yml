name: CI
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check backend tests
      - run: black --check backend tests
      - run: mypy backend
      - run: pytest --cov=backend --cov-fail-under=90
      - run: docker build .
