[project]
name = "jobhunter-ai"
version = "0.1.0"
description = "Production-oriented MCP-powered job application platform"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13.3",
  "aiosqlite>=0.20.0",
  "asyncpg>=0.29.0",
  "celery[redis]>=5.4.0",
  "fastapi>=0.115.0",
  "fastmcp>=2.10.0",
  "httpx>=0.27.2",
  "langgraph>=0.2.55",
  "openai>=1.54.0",
  "playwright>=1.48.0",
  "pydantic>=2.9.2",
  "pydantic-settings>=2.6.1",
  "python-docx>=1.1.2",
  "python-multipart>=0.0.17",
  "reportlab>=4.2.5",
  "sqlalchemy[asyncio]>=2.0.36",
  "streamlit>=1.40.0",
  "structlog>=24.4.0",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
  "black>=24.10.0",
  "mypy>=1.13.0",
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]